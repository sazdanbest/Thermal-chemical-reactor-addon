// ===========================================================
// build.gradle — конфигурация сборки нашего аддона
// ===========================================================
// Этот файл говорит Gradle (системе сборки), какую версию Minecraft/Forge
// использовать, откуда брать зависимости (включая наши jar'ы из libs/),
// и как называется итоговый jar мода.

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

// --- Базовые параметры мода. Меняются один раз, используются ниже. ---
version = '1.0.6'
group = 'com.sazdan.chemreactor' // ваш maven-package, как договаривались
archivesBaseName = 'thermal_addon_chemreactor'

// Используем Java 17, как требует Forge 43.3.5 / Minecraft 1.19.2
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

minecraft {
    // Версия маппингов имён методов/полей (человекочитаемые имена вместо обфусцированных).
    // 'official' — маппинги от Mojang, стандарт для 1.19.2.
    mappings channel: 'official', version: '1.19.2'

    // Описываем два запуска: клиент и сервер, для тестирования через runClient/runServer в IntelliJ
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                thermal_addon_chemreactor {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                thermal_addon_chemreactor {
                    source sourceSets.main
                }
            }
        }
    }
}

// --- Откуда брать зависимости ---
repositories {
    mavenCentral()
    // Локальная папка libs/ — здесь лежат jar'ы Thermal/CoFH.
    // flatDir ищет файлы по схеме "name-version.jar". Поэтому ниже
    // важно правильно разбить имя файла на name и version.
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // Сам Forge — обязательная зависимость, версия должна совпадать с сервером (43.3.5)
    minecraft 'net.minecraftforge:forge:1.19.2-43.3.5'

    // --- Зависимости Thermal/CoFH из папки libs/ ---
    // Файл называется cofh_core-1.19.2-10.3.1.48.jar
    // flatDir ожидает разбиение "name-version.jar", поэтому:
    //   name    = cofh_core
    //   version = 1.19.2-10.3.1.48
    // Координата без group: ":name:version" (двоеточие в начале — group пустой)
    implementation fg.deobf("thermal:cofh_core:1.19.2-10.3.1.48")
    implementation fg.deobf("thermal:thermal_foundation:1.19.2-10.3.1.57")
    implementation fg.deobf("thermal:thermal_expansion:1.19.2-10.3.1.25")

    // thermal_core зашит внутрь thermal_foundation.jar как jarjar-вложение
    // (META-INF/jarjar/thermal_core-1.19.2-10.3.0.9.jar) — Forge разворачивает такие
    // вложения только во время игры (через jarjar-loader), а не на этапе компиляции.
    // Поэтому cofh.thermal.lib.* (пакет, живущий именно в thermal_core, а не в
    // thermal_foundation) не резолвится компилятором, пока jar не извлечён вручную
    // и не подключён как обычная deobf-зависимость.
    implementation fg.deobf("thermal:thermal_core:1.19.2-10.3.0.9")

    // Примечание: отдельного cofh_lib jar'а у вас нет — начиная с этой версии
    // он объединён внутрь cofh_core, поэтому отдельно подключать не нужно.

    // --- Industrial Foregoing + Titanium (используются в первом тестовом рецепте) ---
    // Раньше лежали как обычные jar'ы в run/mods/ — это ломало runClient: релизные jar'ы
    // содержат "сырые" SRG-имена методов/полей (так публикуются все Forge-моды), а наша
    // dev-среда работает с official-маппингами. Без деобфускации это падает с
    // NoSuchMethodError/NoSuchFieldError ещё на этапе загрузки модов. Через fg.deobf
    // jar проходит ту же деобфускацию, что и cofh_core/thermal_*, и грузится нормально.
    implementation fg.deobf("industrialforegoing:industrial-foregoing:1.19.2-3.3.2.3-5")
    implementation fg.deobf("titanium:titanium:1.19.2-3.7.4-31")

    // --- JEI + KubeJS (мягкая/опциональная интеграция) ---
    // Оба мода — обычные release-jar'ы с той же проблемой сырых SRG-имён, что и все
    // остальные зависимости выше (проверено: SRG-паттерн вида m_12345_/f_12345_ реально
    // встречается в байткоде обоих jar'ов при обращении к API Minecraft/Forge) — поэтому
    // тоже идут через fg.deobf, а не голым classpath-jar'ом.
    // "Мягкость" зависимости обеспечивается НЕ на уровне Gradle (implementation тут просто
    // даёт классы на этапе компиляции и в dev-окружении runClient/runServer для тестирования),
    // а тем, что:
    //   - наш код никогда не создаёт/не импортирует JEI- и KubeJS-специфичные классы
    //     (ChemReactorJeiPlugin, ChemReactorKubeJSPlugin) из своего @Mod-конструктора;
    //   - сами JEI и KubeJS обнаруживают эти классы через СВОИ механизмы (аннотация
    //     @JeiPlugin у JEI, resources/kubejs.plugins.txt у KubeJS) — если самих модов нет,
    //     никто эти классы не трогает, и падать из-за отсутствующих mezz.jei.*/
    //     dev.latvian.mods.kubejs.* на classpath игрока просто некому.
    // rhino-forge — транзитивная зависимость самого KubeJS (JS-движок), нужна на classpath
    // компиляции, т.к. некоторые типы KubeJS API от неё зависят.
    implementation fg.deobf("jei:jei-1.19.2-forge:11.8.1.1034")
    implementation fg.deobf("kubejs:kubejs-forge:1902.6.2-build.73")
    implementation fg.deobf("rhino:rhino-forge:1902.2.3-build.284")
    // Architectury API — обязательная (mandatory) зависимость самого KubeJS (KubeJS-forge
    // построен поверх многоплатформенной библиотеки Architectury). Без неё KubeJS не
    // подхватывался как валидный мод.
    implementation fg.deobf("architectury:architectury:6.6.92:forge")
}

// Указываем кодировку исходников — иначе кириллица в комментариях/lang-файлах
// может поломаться на некоторых системах (особенно Windows с другой локалью).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Подставляем номер версии мода и т.п. в resources (используется в mods.toml через ${mod_version}
// и в pack.mcmeta через ${mod_id}).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.19.2',
            forge_version    : '43.3.5',
            mod_version      : project.version,
            mod_id           : project.mod_id
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties + [project: project]
    }
    // pack.mcmeta ссылается на ${mod_id} в описании ресурспака/датапака — раньше эта подстановка
    // не была подключена вообще (только mods.toml проходил через expand), и в итоговый jar
    // попадала буквальная строка "${mod_id} resources" вместо настоящего имени мода.
    filesMatching('pack.mcmeta') {
        expand replaceProperties + [project: project]
    }
}

// Манифест jar'а — техническая информация, не обязательна для работы мода,
// но полезна для отладки (видно версию Forge, под которую собран мод).
jar {
    manifest {
        attributes([
                'Specification-Title'   : 'thermal_addon_chemreactor',
                'Specification-Vendor'  : 'sazdan',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : 'sazdan'
        ])
    }
}